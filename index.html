<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"></head><body style="margin:0"><title>Stephen's Sydney Suburb Shortlist</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen app. Map on the left fills; a 380px ledger on the right ranks the suburbs. Stacks on phones. */
:root{
  --bg:#F3F4F2; --panel:#FFFFFF; --ink:#1B1F24; --ink-2:#4B5563; --ink-3:#8A93A0; --line:#DCE0E3;
  --water:#D9E6EA; --land:#EDEFEA; --rail:#9AA3AD; --metro:#4F8F8B; --road:#E2E5E8;
  --accent:#2F5D8A; --accent-ink:#FFFFFF;
  --r1:#EEE9F6; --r2:#CFC2E6; --r3:#A48DCF; --r4:#73539F; --r5:#3F2566; --r-ink:#1B1F24;
  --cheaper:#1F7A4C; --cheaper-bg:#E3F3EA; --dearer:#B3362B; --dearer-bg:#FBE7E4; --same-bg:#EEF0F2;
  --home:#D9771E;
  --font-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 1px 2px rgba(20,24,30,.06),0 8px 24px rgba(20,24,30,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171B; --panel:#1C2026; --ink:#ECEEF1; --ink-2:#B4BBC5; --ink-3:#7E8794; --line:#2C323A;
  --water:#1A2A31; --land:#1F2429; --rail:#6B7682; --metro:#5FA8A3; --road:#262C33;
  --accent:#7FB0E0; --accent-ink:#0F1419;
  --r1:#2A2538; --r2:#4A3E6E; --r3:#7A62B0; --r4:#A98FE0; --r5:#D8C8FF; --r-ink:#ECEEF1;
  --cheaper:#5FCF8F; --cheaper-bg:#163826; --dearer:#F08A7E; --dearer-bg:#3F1F1B; --same-bg:#262C33;
  --home:#F0A050;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171B; --panel:#1C2026; --ink:#ECEEF1; --ink-2:#B4BBC5; --ink-3:#7E8794; --line:#2C323A;
  --water:#1A2A31; --land:#1F2429; --rail:#6B7682; --metro:#5FA8A3; --road:#262C33;
  --accent:#7FB0E0; --accent-ink:#0F1419;
  --r1:#2A2538; --r2:#4A3E6E; --r3:#7A62B0; --r4:#A98FE0; --r5:#D8C8FF; --r-ink:#ECEEF1;
  --cheaper:#5FCF8F; --cheaper-bg:#163826; --dearer:#F08A7E; --dearer-bg:#3F1F1B; --same-bg:#262C33;
  --home:#F0A050;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-inline:0}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.01em;margin:0;text-wrap:balance}
header h1 small{display:block;font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--ink-3);letter-spacing:0}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg)}
.seg button{padding:5px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.field{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.field input,.field select{font:inherit;font-family:var(--font-mono);font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px;width:92px}
.field select{width:auto;font-family:var(--font-body)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}

main{display:grid;grid-template-columns:1fr 520px;min-height:0}
@media (max-width:1180px){main{grid-template-columns:1fr 440px}}
.mapwrap{position:relative;min-width:0;min-height:0;background:var(--land);overflow:hidden}
.mapwrap svg{display:block;width:100%;height:100%;touch-action:none}
.sub{fill:var(--r3);stroke:var(--panel);stroke-width:1.2;cursor:pointer;transition:opacity .15s}
.sub.dim{opacity:.35}
.sub.sel{stroke:var(--ink);stroke-width:2.2}
.sub.home{stroke:var(--home);stroke-width:2.4;stroke-dasharray:5 3}
.sublabel{font-family:var(--font-body);font-size:11px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round;pointer-events:none;text-anchor:middle}
.sublabel .v{font-family:var(--font-mono);font-weight:500;fill:var(--ink-2)}
.stn{fill:var(--panel);stroke:var(--rail);stroke-width:1.2;pointer-events:none}
.stnlabel{font-size:10px;fill:var(--ink-2);paint-order:stroke;stroke:var(--land);stroke-width:3px;pointer-events:none}
.central{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.centrallabel{font-family:var(--font-display);font-weight:700;font-size:12px;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;pointer-events:none}
.legend{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);font-size:12px;max-width:min(300px,calc(100% - 24px))}
.legend .t{font-weight:600;margin-bottom:6px}
.legend .ramp{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-bottom:4px}
.legend .ramp i{display:block;height:10px;border-radius:2px}
.legend .ticks{display:grid;grid-template-columns:repeat(5,1fr);font-family:var(--font-mono);font-size:10px;color:var(--ink-2)}
.legend .keys{display:flex;flex-direction:column;gap:3px;margin-top:8px;color:var(--ink-2)}
.legend .keys span{display:inline-flex;align-items:center;gap:6px}
.legend .keys i{width:18px;height:0;border-top:2px solid var(--rail)}
.legend .keys i.m{border-color:var(--metro)}
.legend .keys i.h{border-top:2px dashed var(--home)}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:32px;height:32px;border-radius:8px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);font-family:var(--font-mono);font-size:16px;line-height:1}
.hint{position:absolute;left:12px;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11px;color:var(--ink-2);box-shadow:var(--shadow)}
.tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:var(--shadow);min-width:170px;z-index:5}
.tip b{font-family:var(--font-display);font-size:13px}
.tip .row{display:flex;justify-content:space-between;gap:12px;font-family:var(--font-mono);color:var(--ink-2)}
.tip .row strong{color:var(--ink);font-weight:500}

aside{border-left:1px solid var(--line);background:var(--panel);min-height:0;display:flex;flex-direction:column;min-width:0}
.panelhead{padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.you{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.you .big{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.01em}
.you .big em{font-style:normal;color:var(--home)}
.you .sub2{color:var(--ink-3);font-size:12px}
.sortrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--ink-2)}
.list{overflow:auto;flex:1;min-height:0}
table.rank{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.rank th{position:sticky;top:0;background:var(--panel);text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);z-index:1}
table.rank th:first-child,table.rank td:first-child{padding-left:16px}
.sortbtn{font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;padding:2px 0;display:inline-flex;align-items:center;gap:4px;border-radius:4px}
.sortbtn:hover{color:var(--ink)}
.sortbtn i{font-style:normal;width:10px;display:inline-block;text-align:center;color:var(--accent)}
.sortbtn[aria-sort="ascending"],.sortbtn[aria-sort="descending"]{color:var(--ink)}
.sortbtn[aria-sort="ascending"] i::after{content:"▲";font-size:8px}
.sortbtn[aria-sort="descending"] i::after{content:"▼";font-size:8px}
table.rank td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle;cursor:pointer}
table.rank tr:hover td{background:var(--bg)}
table.rank tr.sel td{background:var(--bg);box-shadow:inset 3px 0 0 var(--accent)}
table.rank tr.home td .nm{color:var(--home)}
.nm{font-weight:600;white-space:nowrap}
.nm small{display:block;font-weight:400;color:var(--ink-3);font-size:11px}
.bar{height:6px;border-radius:3px;background:var(--same-bg);position:relative;min-width:70px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--r3)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--home)}
.rent{font-family:var(--font-mono);font-size:13px;text-align:right;white-space:nowrap}
.rent small{display:block;font-size:10px;color:var(--ink-3)}
.chip{display:inline-block;font-family:var(--font-mono);font-size:11px;padding:2px 6px;border-radius:6px;background:var(--same-bg);color:var(--ink-2);white-space:nowrap}
.chip.down{background:var(--cheaper-bg);color:var(--cheaper)}
.chip.up{background:var(--dearer-bg);color:var(--dearer)}
.min{font-family:var(--font-mono);text-align:right;white-space:nowrap}
.min small{color:var(--ink-3);font-size:10px;display:block}

.detail{border-top:1px solid var(--line);padding:14px 16px 16px;max-height:46%;overflow:auto;background:var(--panel)}
.detail h2{font-family:var(--font-display);font-size:20px;margin:0 0 2px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.detail h2 .pc{font-family:var(--font-mono);font-size:12px;font-weight:400;color:var(--ink-3)}
.detail p.blurb{margin:0 0 10px;color:var(--ink-2)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.kpi .v{font-family:var(--font-mono);font-size:17px;margin-top:2px}
.kpi .v small{font-size:11px;color:var(--ink-3)}
.kpi.on{border-color:var(--accent)}
.delta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.delta .chip{font-size:12px;padding:4px 8px}
.commute{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin-bottom:10px}
.commute dt{color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;padding-top:3px}
.commute dd{margin:0}
.commute dd b{font-family:var(--font-mono);font-weight:500}
.note{font-size:12px;color:var(--ink-2);border-left:2px solid var(--home);padding-left:8px;margin:0 0 10px}
.xcheck{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:12px}
.xcheck .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;margin-bottom:4px}
.xcheck .row{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:baseline;padding:2px 0;color:var(--ink-2)}
.xcheck .row b{font-family:var(--font-mono);font-weight:500;color:var(--ink)}
.xcheck .row i{font-style:normal;font-family:var(--font-mono);font-size:10px;color:var(--ink-3);min-width:52px;text-align:right}
.xcheck .xn{color:var(--ink-3);margin-top:4px}
.src{font-size:11px;color:var(--ink-3)}
.src a{color:var(--accent)}
.foot{padding:8px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3)}
.foot a{color:var(--accent)}

@media (max-width:900px){
  .app{height:auto;min-height:100%}
  main{grid-template-columns:1fr}
  .mapwrap{height:58vh;min-height:360px}
  aside{border-left:0;border-top:1px solid var(--line)}
  .list{max-height:60vh}
  .detail{max-height:none}
  header.top{padding-inline:16px}
  .controls{margin-left:0;width:100%}
  table.rank .barcell{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <h1>Stephen's Sydney Suburb Shortlist<small>Median advertised unit rent, 12 months to Oct 2026, and 8am travel time to Central</small></h1>
    <div class="controls">
      <div class="seg" role="group" aria-label="Bedrooms">
        <button id="bed1" aria-pressed="false">1 bed</button>
        <button id="bed2" aria-pressed="true">2 bed</button>
      </div>
      <label class="field" for="yourRent"><span class="lbl">Your rent</span> $<input id="yourRent" type="number" min="200" max="3000" step="5" value="910"> /wk</label>
    </div>
  </header>
  <main>
    <div class="mapwrap" id="mapwrap">
      <svg id="map" role="img" aria-label="Map of selected Sydney suburbs shaded by median rent"></svg>
      <div class="hint">Scroll to zoom. Drag to pan. Tap a suburb.</div>
      <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zreset" aria-label="Reset view" style="font-size:12px">⌂</button></div>
      <div class="legend" id="legend"></div>
      <div class="tip" id="tip" hidden></div>

      <div class="panelhead">
        <div class="you"><div class="big">Wolli Creek, <em id="youRentLabel">$910</em>/wk</div><div class="sub2" id="youMedian"></div></div>

      </div>
      <div class="list">
        <table class="rank" id="rank">
          <thead><tr>
            <th><button class="sortbtn" data-key="name">Suburb<i></i></button></th>

            <th style="text-align:right"><button class="sortbtn" data-key="rent"><span id="rentHead">2 bed</span><i></i></button></th>
            <th><button class="sortbtn" data-key="rent">vs you<i></i></button></th>
            <th style="text-align:right"><button class="sortbtn" data-key="commute">To Central<i></i></button></th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="detail" id="detail"></div>
    </aside>
  </main>
</div>

const LABEL_STATIONS = new Set(['Central','Town Hall','Wynyard','Martin Place','Circular Quay','Redfern','Sydenham','Tempe','Green Square','Mascot','Wolli Creek','Arncliffe','Rockdale','Kogarah','Hurstville','Marrickville','Ashfield','Summer Hill','Burwood','Strathfield','Rhodes','Chatswood','St Leonards','Crows Nest','Waterloo','North Sydney','Domestic Airport','International Airport','Newtown','Erskineville','Dulwich Hill','Petersham','Croydon','Homebush','Concord West','Artarmon','Wollstonecraft','Waverton','Milsons Point','Kings Cross','Bondi Junction','Banksia','Carlton','Allawah','Turrella','Bardwell Park','Lidcombe','North Strathfield','Meadowbank','West Ryde','Canterbury','Campsie','Lewisham','Stanmore','Macdonaldtown','St Peters','Edgecliff','Pyrmont Bay']);

// ---------- state ----------
let bed = 2, yourRent = 910, sort = 'rent', sortDir = 1, selected = null;
const byId = Object.fromEntries(SUBURBS.map(s => [s.id, s]));
const polyToSub = {}; SUBURBS.forEach(s => s.polys.forEach(p => polyToSub[p] = s.id));
const fmt = n => '$' + Math.round(n).toLocaleString('en-AU');

// ---------- map ----------
const wrap = document.getElementById('mapwrap');
const svg = d3.select('#map');
const g = svg.append('g');
const gBase = g.append('g'), gSub = g.append('g'), gStn = g.append('g'), gLab = g.append('g');
const proj = d3.geoMercator();
const path = d3.geoPath(proj);
const feats = GEO.features.filter(f => polyToSub[f.properties.name]);
feats.forEach(f => { if (d3.geoArea(f) > 2 * Math.PI) { const rev = p => p.map(r => r.slice().reverse()); f.geometry.coordinates = f.geometry.type === 'Polygon' ? rev(f.geometry.coordinates) : f.geometry.coordinates.map(rev); } });
const fc = {type:'FeatureCollection', features: feats};
let W = 10, H = 10;

function lineFeature(arr){ return {type:'Feature', geometry:{type:'MultiLineString', coordinates: arr}}; }
const layers = [
  ['motorway', BASE.layers.motorway, 'var(--road)', 2.2, null],
  ['coast', BASE.layers.coast, 'var(--water)', 3, null],
  ['river', BASE.layers.river, 'var(--water)', 2.4, null],
  ['runway', BASE.layers.runway, 'var(--rail)', 4, null],
  ['rail', BASE.layers.rail, 'var(--rail)', 1.1, null],
  ['light_rail', BASE.layers.light_rail, 'var(--rail)', 0.8, '2 2'],
  ['subway', BASE.layers.subway, 'var(--metro)', 1.6, null],
];
const basePaths = layers.map(([k, arr, stroke, w, dash]) =>
  gBase.append('path').datum(lineFeature(arr)).attr('fill','none').attr('stroke',stroke).attr('stroke-width',w).attr('stroke-linecap','round').attr('stroke-linejoin','round').attr('stroke-dasharray',dash).attr('class','base-'+k));
// coast rendered a second time as a thin dark edge
const coastEdge = gBase.append('path').datum(lineFeature(BASE.layers.coast)).attr('fill','none').attr('stroke','var(--rail)').attr('stroke-width',0.6).attr('opacity',.6);

const subPaths = gSub.selectAll('path').data(feats).join('path')
  .attr('class', d => 'sub' + (byId[polyToSub[d.properties.name]].home ? ' home' : ''))
  .on('mousemove', (ev, d) => showTip(ev, byId[polyToSub[d.properties.name]]))
  .on('mouseleave', hideTip)
  .on('click', (ev, d) => select(polyToSub[d.properties.name], true));

const allStations = BASE.stations.concat(EXTRA_STATIONS);
const stn = gStn.selectAll('g').data(allStations).join('g');
stn.append('circle').attr('class', d => d.major ? 'central' : 'stn').attr('r', d => d.major ? 5 : 2.4);
stn.filter(d => LABEL_STATIONS.has(d.n)).append('text').attr('class', d => d.major ? 'centrallabel' : 'stnlabel').attr('x', d => d.major ? 8 : 5).attr('y', 3).text(d => d.n);

// one label per suburb entry (not per polygon) at the biggest polygon's centroid
const labelData = SUBURBS.map(s => {
  const fs = feats.filter(f => polyToSub[f.properties.name] === s.id);
  fs.sort((a,b) => d3.geoArea(b) - d3.geoArea(a));
  return {s, f: fs[0]};
});
const labels = gLab.selectAll('text').data(labelData).join('text').attr('class','sublabel');
labels.append('tspan').attr('class','n').text(d => d.s.name);
labels.append('tspan').attr('class','v').attr('x',0).attr('dy','1.15em');

let curK = 1;
function applyZoom(k){
  curK = k;
  const wide = W >= 1000;
  g.selectAll('.stn').attr('r', 2.4 / Math.sqrt(k));
  g.selectAll('.stnlabel').style('font-size', (10 / Math.sqrt(k)) + 'px').style('display', (k >= 1.6 || (wide && k >= 1.15)) ? null : 'none');
  g.selectAll('.sublabel').style('font-size', (11 / Math.pow(k, .35)) + 'px');
  g.selectAll('.sublabel tspan.v').style('display', (k >= 1.3 || wide) ? null : 'none');
  basePaths.forEach((p, i) => p.attr('stroke-width', layers[i][3] / Math.sqrt(k)));
  gSub.selectAll('path').style('stroke-width', function(){ return (this.classList.contains('home') ? 2.4 : this.classList.contains('sel') ? 2.2 : 1.2) / Math.sqrt(k) + 'px'; });
}
const zoom = d3.zoom().scaleExtent([0.8, 14]).on('zoom', ev => { g.attr('transform', ev.transform); applyZoom(ev.transform.k); });
svg.call(zoom);
document.getElementById('zin').onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 1.6);
document.getElementById('zout').onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 1/1.6);
document.getElementById('zreset').onclick = () => svg.transition().duration(350).call(zoom.transform, d3.zoomIdentity);

function layout(){
  W = wrap.clientWidth; H = wrap.clientHeight;
  svg.attr('viewBox', `0 0 ${W} ${H}`);
  proj.fitExtent([[24, 24], [W - 24, H - 24]], fc);
  basePaths.forEach(p => p.attr('d', path)); coastEdge.attr('d', path);
  subPaths.attr('d', path);
  stn.attr('transform', d => { const [x,y] = proj([d.x, d.y]); return `translate(${x},${y})`; });
  labels.attr('transform', d => { const [x,y] = path.centroid(d.f); return `translate(${x},${y})`; }).select('tspan.n').attr('x',0);
}
new ResizeObserver(() => { layout(); applyZoom(curK); }).observe(wrap);
layout(); applyZoom(1);

// ---------- colour ----------
const RAMP = ['var(--r1)','var(--r2)','var(--r3)','var(--r4)','var(--r5)'];
let thresholds = [];
function recolor(){
  const vals = SUBURBS.map(s => s.rent[bed]);
  const lo = d3.min(vals), hi = d3.max(vals);
  const step = (hi - lo) / 5;
  thresholds = [1,2,3,4].map(i => lo + step * i);
  const scale = d3.scaleThreshold().domain(thresholds).range(RAMP);
  subPaths.style('fill', d => scale(byId[polyToSub[d.properties.name]].rent[bed]));
  labels.select('tspan.v').text(d => fmt(d.s.rent[bed]));
  const lg = document.getElementById('legend');
  const edges = [lo, ...thresholds, hi];
  lg.innerHTML = `<div class="t">Median ${bed}-bed unit rent, $/week</div>
    <div class="ramp">${RAMP.map(c => `<i style="background:${c}"></i>`).join('')}</div>
    <div class="ticks">${edges.slice(0,5).map((e,i) => `<span>${Math.round(e)}${i===4 ? '+' : ''}</span>`).join('')}</div>
    <div class="keys"><span><i class="h"></i>Wolli Creek (you)</span><span><i></i>Sydney Trains</span><span><i class="m"></i>Metro</span></div>`;
}

// ---------- tooltip ----------
const tip = document.getElementById('tip');
function showTip(ev, s){
  const r = s.rent[bed], d = r - yourRent;
  tip.innerHTML = `<b>${s.name}</b>
    <div class="row"><span>${bed} bed</span><strong>${fmt(r)}/wk</strong></div>
    <div class="row"><span>vs you</span><strong style="color:${d<0?'var(--cheaper)':d>0?'var(--dearer)':'inherit'}">${d===0?'same':(d>0?'+':'−')+fmt(Math.abs(d))}</strong></div>
    <div class="row"><span>to Central</span><strong>${s.commute.min} min</strong></div>`;
  tip.hidden = false;
  const bx = wrap.getBoundingClientRect();
  let x = ev.clientX - bx.left + 14, y = ev.clientY - bx.top + 14;
  if (x + 200 > bx.width) x -= 214; if (y + 110 > bx.height) y -= 120;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip(){ tip.hidden = true; }

// ---------- list ----------
function sorted(){
  const a = SUBURBS.slice();
  const cmp = {
    rent: (x,y) => x.rent[bed] - y.rent[bed] || x.commute.min - y.commute.min,
    commute: (x,y) => x.commute.min - y.commute.min || x.rent[bed] - y.rent[bed],
    name: (x,y) => x.name.localeCompare(y.name)
  }[sort];
  a.sort((x,y) => sortDir * cmp(x,y));
  return a;
}
function setSort(key){
  if (sort === key) sortDir = -sortDir; else { sort = key; sortDir = 1; }
  document.querySelectorAll('.sortbtn').forEach(b => b.setAttribute('aria-sort', b.dataset.key === sort ? (sortDir === 1 ? 'ascending' : 'descending') : 'none'));
  renderList();
}
document.querySelectorAll('.sortbtn').forEach(b => { b.onclick = () => setSort(b.dataset.key); b.setAttribute('aria-sort', b.dataset.key === 'rent' ? 'ascending' : 'none'); });
function renderList(){
  const tb = document.querySelector('#rank tbody');
  const max = d3.max(SUBURBS, s => s.rent[bed]);
  const homePct = Math.min(100, yourRent / max * 100);
  tb.innerHTML = sorted().map(s => {
    const r = s.rent[bed], d = r - yourRent;
    const chip = d === 0 ? `<span class="chip">same</span>` : `<span class="chip ${d<0?'down':'up'}">${d>0?'+':'−'}${fmt(Math.abs(d))}</span>`;
    return `<tr data-id="${s.id}" class="${s.id===selected?'sel':''}${s.home?' home':''}" tabindex="0">
      <td><div class="nm">${s.name}${s.home ? '<small>you live here</small>' : s.tag ? `<small>${s.tag}</small>` : ''}</div></td>
      <td class="barcell"><div class="bar"><i style="width:${r/max*100}%"></i><b style="left:${homePct}%"></b></div></td>
      <td class="rent">${fmt(r)}</td>
      <td>${chip}</td>
      <td class="min">${s.commute.min}<small>${s.commute.modeShort}</small></td></tr>`;
  }).join('');
  tb.querySelectorAll('tr').forEach(tr => {
    tr.onclick = () => select(tr.dataset.id, false);
    tr.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(tr.dataset.id, false); } };
    tr.onmouseenter = () => highlight(tr.dataset.id);
    tr.onmouseleave = () => highlight(null);
  });
  document.getElementById('rentHead').textContent = bed + ' bed';
  const cheaper = SUBURBS.filter(s => !s.home && s.rent[bed] < yourRent).length;
  document.getElementById('countLabel').textContent = `${SUBURBS.length - 1} suburbs compared. ${cheaper} have a lower ${bed}-bed median than your rent.`;
  document.getElementById('youRentLabel').textContent = fmt(yourRent);
  const wc = byId['wolli-creek'].rent[bed];
  document.getElementById('youMedian').textContent = `Wolli Creek ${bed}-bed median ${fmt(wc)} (you pay ${yourRent === wc ? 'the median' : (yourRent > wc ? fmt(yourRent - wc) + ' above' : fmt(wc - yourRent) + ' below')})`;
}
function highlight(id){
  subPaths.classed('dim', d => id && polyToSub[d.properties.name] !== id);
}

// ---------- detail ----------
function select(id, fromMap){
  selected = id;
  const s = byId[id];
  subPaths.classed('sel', d => polyToSub[d.properties.name] === id);
  applyZoom(curK);
  document.querySelectorAll('#rank tr').forEach(tr => tr.classList.toggle('sel', tr.dataset.id === id));
  const row = document.querySelector(`#rank tr[data-id="${id}"]`);
  if (row && fromMap) row.scrollIntoView({block:'nearest', behavior:'smooth'});
  renderDetail(s);
  if (!fromMap && window.innerWidth <= 860) document.getElementById('detail').scrollIntoView({behavior:'smooth', block:'nearest'});
}
function renderDetail(s){
  const el = document.getElementById('detail');
  if (!s) { el.innerHTML = `<p class="blurb" style="color:var(--ink-3);margin:0">Pick a suburb on the map or in the list to see 1, 2 and 3 bed medians, the yearly difference against your rent, and the commute detail.</p>`; return; }

  const wc = byId['wolli-creek'].rent[bed], dm = r - wc;
  el.innerHTML = `
    <h2>${s.name} <span class="pc">${s.pc}</span>${s.home ? '<span class="chip" style="background:var(--home);color:#fff">you</span>' : ''}</h2>
    <p class="blurb">${s.blurb}</p>
    <div class="kpis">
      ${[1,2,3].map(b => `<div class="kpi ${b===bed?'on':''}"><div class="k">${b} bed</div><div class="v">${s.rent[b] ? fmt(s.rent[b]) : '—'}<small>/wk</small></div></div>`).join('')}

    <div class="delta">${chip}<span class="src">${s.home ? '' : `${dm===0?'Same as':dm<0?fmt(Math.abs(dm))+' below':fmt(dm)+' above'} the Wolli Creek ${bed}-bed median`}</span></div>
    <dl class="commute">
      <dt>To Central</dt><dd><b>${s.commute.min} min</b> ${s.commute.mode}</dd>
      <dt>Line</dt><dd>${s.commute.line}</dd>
      <dt>Peak</dt><dd>${s.commute.freq}</dd>
      ${s.commute.alt ? `<dt>Also</dt><dd>${s.commute.alt}</dd>` : ''}
    </dl>
    ${s.warn ? `<p class="note">${s.warn}</p>` : ''}
    <div class="xcheck"><div class="k">Cross-check, postcode ${s.pc}</div>
      <div class="row"><span>SQM asking rent, 2 bed, week ending 4 Oct 2026</span><b>${fmt(s.sqm2)}</b><i>${s.sqmChg} yr</i></div>
      <div class="row"><span>NSW bond median, 1 bed, new leases Apr to Jun 2026</span><b>${fmt(s.dcj1)}</b></div>
      <div class="row"><span>NSW bond median, 2 bed, new leases Apr to Jun 2026</span><b>${fmt(s.dcj2)}</b></div>
      ${s.xnote ? `<div class="xn">${s.xnote.charAt(0).toUpperCase() + s.xnote.slice(1)}.</div>` : ''}</div>
    <div class="src">Headline figures: <a href="${s.src}" target="_blank" rel="noopener">Domain suburb profile</a>, median asking rent for units over the last 12 months, suburb level. Cross-checks are postcode level: <a href="https://sqmresearch.com.au/weekly-rents.php?postcode=${s.pc}&amp;t=1" target="_blank" rel="noopener">SQM Research</a> and the <a href="https://dcj.nsw.gov.au/about-us/families-and-communities-statistics/housing-rent-and-sales/rent-and-sales-report.html" target="_blank" rel="noopener">NSW Rent and Sales Report</a>, June 2026 quarter. Travel time: fastest regular service in Google Maps transit for a Monday 8:00am departure from the station (or the suburb centre where there is no station), checked 9 Oct 2026. Boundaries: NSW Spatial Services. Basemap: © OpenStreetMap contributors.</div>`;
}

// ---------- controls ----------
function setBed(b){
  bed = b;
  document.getElementById('bed1').setAttribute('aria-pressed', b === 1);
  document.getElementById('bed2').setAttribute('aria-pressed', b === 2);
  recolor(); renderList(); renderDetail(selected && byId[selected]);
}
document.getElementById('bed1').onclick = () => setBed(1);
document.getElementById('bed2').onclick = () => setBed(2);
document.getElementById('yourRent').oninput = e => { const v = +e.target.value; if (v > 0) { yourRent = v; renderList(); renderDetail(selected && byId[selected]); } };
setBed(bed);
renderDetail(null);
</script>
